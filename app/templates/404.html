{% extends "base.html" %}
{% block title %}Not Found{% endblock %}

{% block content %}
<div class="error-page">
  <div class="error-visual" aria-hidden="true">
    <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" class="error-svg">
      <circle cx="60" cy="60" r="52" fill="url(#e404-grad)" opacity="0.1"/>
      <circle cx="60" cy="60" r="38" fill="url(#e404-grad)" opacity="0.18"/>
      <path d="M42 42l36 36M78 42L42 78" stroke="#6366f1" stroke-width="5" stroke-linecap="round"/>
      <defs>
        <linearGradient id="e404-grad" x1="8" y1="8" x2="112" y2="112" gradientUnits="userSpaceOnUse">
          <stop stop-color="#6366f1"/>
          <stop offset="1" stop-color="#8b5cf6"/>
        </linearGradient>
      </defs>
    </svg>
  </div>
  <div class="error-code">404</div>
  <h1 class="error-title">Page Not Found</h1>
  <p class="error-message">The page you're looking for doesn't exist or has been moved.</p>
  <div class="error-actions">
    <a href="{{ url_for('main.landing') }}" class="btn btn-primary">Go to Home</a>
  </div>
</div>
{% endblock %}
